name: Daily screen feed

on:
  schedule:
    - cron: "0 4 * * *"   # 06:00 Stockholm summer time, 05:00 in winter
  workflow_dispatch:       # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch events, football and weather, build today.json
        env:
          TM_KEY: ${{ secrets.TM_KEY }}
          FOOTBALL_KEY: ${{ secrets.FOOTBALL_KEY }}
        run: |
          mkdir -p work && cd work
          python ../scripts/refresh.py "$TM_KEY"
          cp ../events.json db/
          python ../scripts/football.py db/football_api.json
          python ../scripts/visitstockholm.py db/visitstockholm.json
          python ../scripts/build_feed.py db ../today.json
      - name: Publish
        run: |
          git config user.name "HowCom Radar"
          git config user.email "actions@users.noreply.github.com"
          git add today.json
          git diff --cached --quiet || git commit -m "Update today.json"
          git push
